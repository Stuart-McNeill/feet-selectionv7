<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Foot Tool - Preview</title>
    <style>
        body { margin: 0; background: #0a0a0c; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; }
        .sidebar { width: 220px; padding: 20px; background: rgba(26,26,30,0.9); z-index: 10; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; }
        .viewport { flex: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .label { color: #888; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
        button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; }
        button.active { background: #00f2ff; color: black; border-color: #00f2ff; }
        .status { margin-top: auto; padding-top: 20px; border-top: 1px solid #333; }
        .region-text { color: #00f2ff; font-weight: bold; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="label">SELECTION</div>
        <div style="display: flex; gap: 10px;">
            <button id="btn-left" onclick="run('SELECT', {side:'left'})">LEFT</button>
            <button id="btn-right" class="active" onclick="run('SELECT', {side:'right'})">RIGHT</button>
        </div>
        <div class="label">TOOLS</div>
        <button id="btn-rotate" class="active" onclick="run('SET_MODE', {mode:'rotate'})">ROTATE</button>
        <button id="btn-mark" onclick="run('SET_MODE', {mode:'mark'})">MARK</button>
        <div style="display: flex; gap: 10px;">
            <button style="flex:1" onclick="run('UNDO')">UNDO</button>
            <button style="flex:1" onclick="run('CLEAR')">CLEAR</button>
        </div>
        <div class="status">
            <div class="label">CURRENT REGION</div>
            <div id="region" class="region-text">Ready</div>
        </div>
    </div>
    <div class="viewport">
        <iframe id="viewer" src="index.html"></iframe>
    </div>
    <script>
        const viewer = document.getElementById('viewer');
        function run(action, params = {}) {
            const cmd = JSON.stringify({ action, ...params });
            viewer.contentWindow.postMessage(cmd, "*");

            // UI Toggle logic
            if (action === 'SELECT') {
                document.getElementById('btn-left').className = params.side === 'left' ? 'active' : '';
                document.getElementById('btn-right').className = params.side === 'right' ? 'active' : '';
            }
            if (action === 'SET_MODE') {
                document.getElementById('btn-rotate').className = params.mode === 'rotate' ? 'active' : '';
                document.getElementById('btn-mark').className = params.mode === 'mark' ? 'active' : '';
            }
        }
        window.addEventListener('message', (e) => {
            try {
                const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                if (data.region) document.getElementById('region').innerText = data.region;
            } catch(err) {}
        });
    </script>
</body>
</html>
